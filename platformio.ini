[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/embedd-data-intake/cc1101-afec
build_flags =
    -D AFEC_LOG_LEVEL=4
    -D AFEC_LOG_FORMAT=1

; Same as esp32dev, but builds against the local ../cc1101-afec submodule
; so unpushed library edits are picked up:  pio run -e dev
[env:dev]
extends = env:esp32dev
lib_deps =
    symlink://../cc1101-afec
