[common]
build_flags =
    -D AFEC_LOG_LEVEL=4
    -D AFEC_LOG_FORMAT=1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/embedd-data-intake/cc1101-afec
; AFEC_LOG_SINK selects where the log lines go: 0 off, 1 serial, 2 mqtt, 3 both (src/afec_log_sink.h).
; MQTT needs src/secrets.h (copy secrets.example.h).
build_flags =
    ${common.build_flags}
    -D AFEC_LOG_SINK=1

; Same as esp32dev, but builds against the local ../cc1101-afec submodule
; so unpushed library edits are picked up:  pio run -e dev
[env:dev]
extends = env:esp32dev
lib_deps =
    symlink://../cc1101-afec

; As `dev`, but the logs are published to MQTT instead of serial (commands still come over serial).
[env:dev-mqtt]
extends = env:dev
build_flags =
    ${common.build_flags}
    -D AFEC_LOG_SINK=2
